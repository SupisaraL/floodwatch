services:
  floodwatch:
    build:
      context: .
      dockerfile: Dockerfile
    image: floodwatch_3:local
    container_name: floodwatch_3
    ports:
      - "7120:8010"
    gpus: all
    environment:
      HF_HOME: /app/model-cache/huggingface
      TORCH_HOME: /app/model-cache/torch
    volumes:
      - ./model-cache:/app/model-cache:ro
      - ./runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
